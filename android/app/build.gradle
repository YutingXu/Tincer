plugins {
  id 'com.android.application'
  id 'kotlin-android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreAvailable = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (keystoreAvailable) keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
  compileSdkVersion 'android-37.0'

  defaultConfig {
    applicationId 'dev.yuting.tinc'
    minSdkVersion 26
    targetSdkVersion 36
    multiDexEnabled true
    versionCode 1
    versionName '0.1.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    ndk {
      abiFilters 'arm64-v8a', 'x86_64'
    }
  }

  if (keystoreAvailable) signingConfigs {
    release {
      keyAlias keystoreProperties['keyAlias']
      keyPassword keystoreProperties['keyPassword']
      storeFile file(keystoreProperties['storeFile'])
      storePassword keystoreProperties['storePassword']
    }
  }

  buildTypes {
    release {
      if (keystoreAvailable) signingConfig signingConfigs.release
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }

  buildFeatures {
    buildConfig = true
    compose = true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  namespace 'org.pacien.tincapp'
  ndkVersion '28.2.13676358'

  packagingOptions {
    jniLibs { useLegacyPackaging = true }
    resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])

  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
  implementation 'net.sourceforge.streamsupport:streamsupport-cfuture:1.7.0'
  implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
  implementation 'androidx.core:core-ktx:1.17.0'
  implementation 'com.google.android.material:material:1.13.0'
  implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
  implementation 'org.bouncycastle:bcpkix-jdk15on:1.67'
  implementation 'org.slf4j:slf4j-api:1.7.30'
  implementation 'com.github.tony19:logback-android:2.0.0'
  // commons-configuration2:2.4 requires support for interface default methods, not available on SDK <24
  implementation('org.apache.commons:commons-configuration2:2.3') { exclude group: 'commons-logging', module: 'commons-logging' }
  implementation('commons-beanutils:commons-beanutils:1.9.3') { exclude group: 'commons-logging', module: 'commons-logging' }
  implementation('commons-io:commons-io:2.16.1') { exclude group: 'commons-logging', module: 'commons-logging' }

  def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
  implementation composeBom
  androidTestImplementation composeBom
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'androidx.activity:activity-compose:1.13.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'commons-logging:commons-logging:1.2'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
  androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
  debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

repositories {
  mavenCentral()
  google()
}

def playCredentialsPath = keystoreProperties['apiKeyFile']
def playCredentialsFile = playCredentialsPath ? file(playCredentialsPath) : null

if (playCredentialsFile?.exists()) {
  apply plugin: 'com.github.triplet.play'

  play {
    serviceAccountCredentials = playCredentialsFile
    track = 'beta'
    resolutionStrategy = "auto"
  }
}
